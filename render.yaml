# Render Blueprint — backend API only.
# Dashboard: New → Blueprint → connect this GitHub repo.
# Secrets are NOT in this file (sync: false). Paste values in the Render UI.
# Redis is optional; leave REDIS_URL unset. Do not set REQUIRE_REDIS.
#
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: phoenix-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONVEX_URL
        sync: false
      - key: CONVEX_ADMIN_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
