# Deploys Convex functions when convex/ changes on main.
# Store the production deploy key as a GitHub Actions secret named CONVEX_DEPLOY_KEY.
# Never commit the key. Rotate it if it was ever committed or pasted in chat.

name: Deploy Convex

on:
  push:
    branches: [main]
    paths:
      - 'convex/**'
      - '.github/workflows/deploy-convex.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: convex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: convex/package-lock.json
      - run: npm ci
      - run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
